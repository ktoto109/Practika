{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sarro Orbital Mining{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block page_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="header">
        <div class="container header__inner">
            <a href="{% url 'index' %}" class="header__logo">Sarro</a>

            <nav class="header__nav">
                <a href="{% url 'index' %}"
                   class="header__nav-link"
                   {% if request.resolver_match.url_name == 'index' %}aria-current="page"{% endif %}>General</a>
                <a href="{% url 'catalog' %}"
                   class="header__nav-link"
                   {% if request.resolver_match.url_name == 'catalog' %}aria-current="page"{% endif %}>Catalog</a>
            </nav>

            <div class="header__auth">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="button button--header">Profile</a>
                    <a href="{% url 'logout' %}" class="button button--header button--wide">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="button button--header">Log</a>
                    <a href="{% url 'register' %}" class="button button--header button--wide">Reg</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
