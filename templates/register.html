{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация — Sarro{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'css/components/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/pages/register.css' %}">
{% endblock %}

{% block content %}
<div class="container page page--register">
    <section class="auth-panel auth-panel--register">
        <h1 class="auth-panel__title">Регистрация</h1>

        {% if error %}
            <p class="auth-panel__error">{{ error }}</p>
        {% endif %}

        <form method="post" action="{% url 'register' %}" class="auth-form auth-form--register">
            {% csrf_token %}

            <div class="auth-form__rows">
                <label class="auth-form__field">
                    <span class="auth-form__label">email</span>
                    <input type="email"
                           name="email"
                           class="auth-form__input"
                           autocomplete="email"
                           required>
                </label>

                <label class="auth-form__field">
                    <span class="auth-form__label">пароль</span>
                    <input type="password"
                           name="password"
                           class="auth-form__input"
                           autocomplete="new-password"
                           required>
                </label>

                <label class="auth-form__field">
                    <span class="auth-form__label">пароль</span>
                    <input type="password"
                           name="password2"
                           class="auth-form__input"
                           autocomplete="new-password"
                           required>
                </label>
            </div>

            <button type="submit" class="button button--auth button--auth--register">Регистрация</button>
        </form>
    </section>
</div>
{% endblock %}
